<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zipline Guanacaste - Aventura, canopy y adrenalina en Costa Rica">
  <title>Zipline Guanacaste</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <img src="images/logo.png" alt="Logo Zipline Guanacaste" class="logo">
    <h1>Zipline Guanacaste</h1>
    <p class="subtitle">Aventura • Naturaleza • Adrenalina</p>
  </header>

  <!-- MAIN -->
  <main>

    <!-- INTRO -->
    <section class="intro">
      <h2>Vive la mejor experiencia de Zipline</h2>
      <p>
        Disfruta de una aventura inolvidable en Guanacaste.
        Canopy seguro, vistas increíbles y diversión garantizada.
      </p>
    </section>

    <!-- GALLERY -->
    <section class="gallery">
      <h2>Galería</h2>
      <div class="gallery-grid">
        <img src="images/zipline-guanacaste/zipline-01.jpg" alt="Zipline en la montaña">
        <img src="images/zipline-guanacaste/zipline-02.jpg" alt="Personas disfrutando zipline">
        <img src="images/zipline-guanacaste/zipline-03.jpg" alt="Canopy en Guanacaste">
        <img src="images/zipline-guanacaste/zipline-04.jpg" alt="Aventura extrema">
        <img src="images/zipline-guanacaste/zipline-05.jpg" alt="Vista aérea zipline">
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Zipline Guanacaste. Todos los derechos reservados.</p>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
